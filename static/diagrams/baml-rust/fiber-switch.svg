<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
<title id="title">A pause is a stack-pointer swap</title>
<desc id="desc">Three panels. Running: the stack pointer is on the fiber, where sum runs. Suspend: registers are pushed onto the fiber and the stack pointer moves back to the thread, where the VM loop receives Await(fut). Resume: the stack pointer moves back to the fiber and suspend returns to sum.</desc>
<style>
  :root { color: #1a1a1a; --secondary: #6b6b66; --accent: #42677b; }
  @media (prefers-color-scheme: dark) {
    :root { color: #f3f3ee; --secondary: #aaa89f; --accent: #9abccc; }
  }
  text { fill: currentColor; font-family: monospace; font-size: 15px; }
  .small { font-size: 13px; }
  .muted { fill: var(--secondary); }
  .action { fill: var(--accent); }
  .center { text-anchor: middle; }
  rect, path { fill: none; stroke: currentColor; stroke-width: 1.25; }
  .faint { stroke: var(--secondary); }
  .flow { stroke: var(--accent); }
  .dash { stroke-dasharray: 4 4; }
  .on { stroke: var(--accent); stroke-width: 1.75; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" /></marker>
  <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="flow" d="M1 1 9 5 1 9" /></marker>
  <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="faint" d="M1 1 9 5 1 9" /></marker>
</defs>

<text class="center" x="118" y="34">1  running</text>
<text class="small muted center" x="118" y="60">sum runs on the fiber</text>
<rect class="faint" x="10" y="110" width="100" height="184" rx="4" />
<rect class="" x="18" y="256" width="84" height="30" rx="3" />
<text class="small center" x="60" y="276">vm loop</text>
<rect class="on" x="126" y="110" width="100" height="184" rx="4" />
<rect class="" x="134" y="256" width="84" height="30" rx="3" />
<text class="small center" x="176" y="276">sum</text>
<text class="small action center" x="176" y="222">sp</text>
<path class="flow" d="M176 228V252" marker-end="url(#arrow-a)" />
<text class="small muted center" x="60" y="316">thread</text>
<text class="small muted center" x="176" y="316">fiber</text>
<text class="center" x="380" y="34">2  suspend</text>
<text class="small muted center" x="380" y="60">the VM gets Await(fut)</text>
<rect class="on" x="272" y="110" width="100" height="184" rx="4" />
<rect class="" x="280" y="256" width="84" height="30" rx="3" />
<text class="small center" x="322" y="276">vm loop</text>
<text class="small action center" x="322" y="222">sp</text>
<path class="flow" d="M322 228V252" marker-end="url(#arrow-a)" />
<rect class="faint" x="388" y="110" width="100" height="184" rx="4" />
<rect class="faint" x="396" y="256" width="84" height="30" rx="3" />
<text class="small center muted" x="438" y="276">sum</text>
<rect class="faint" x="396" y="222" width="84" height="30" rx="3" />
<text class="small center muted" x="438" y="242">suspend</text>
<rect class="faint" x="396" y="188" width="84" height="30" rx="3" />
<text class="small center muted" x="438" y="208">registers</text>
<text class="small muted center" x="322" y="316">thread</text>
<text class="small muted center" x="438" y="316">fiber</text>
<text class="center" x="642" y="34">3  resume</text>
<text class="small muted center" x="642" y="60">suspend returns to sum</text>
<rect class="faint" x="534" y="110" width="100" height="184" rx="4" />
<rect class="" x="542" y="256" width="84" height="30" rx="3" />
<text class="small center" x="584" y="276">vm loop</text>
<rect class="on" x="650" y="110" width="100" height="184" rx="4" />
<rect class="" x="658" y="256" width="84" height="30" rx="3" />
<text class="small center" x="700" y="276">sum</text>
<rect class="" x="658" y="222" width="84" height="30" rx="3" />
<text class="small center" x="700" y="242">suspend</text>
<text class="small action center" x="700" y="188">sp</text>
<path class="flow" d="M700 194V218" marker-end="url(#arrow-a)" />
<text class="small muted center" x="584" y="316">thread</text>
