<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">The working loop</title>
<desc id="desc">Humans define requirements and revise checks. An agent submits a candidate to a harness. A failure returns evidence for another attempt. A pass proceeds to the next applicable gate.</desc>
<style>
  :root { color: #1a1a1a; --failure: #b34d48; --pass: #347763; --unknown: #947322; --evidence: #52778c; }
  @media (prefers-color-scheme: dark) { :root { color: #f3f3ee; --failure: #cf8078; --pass: #81b29b; --unknown: #c5ae6a; --evidence: #8daab9; } }
  text { fill: currentColor; font-family: monospace; font-size: 17px; }
  .small { font-size: 14px; }
  rect, circle, path, line { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .box { fill: none; }
  .arrow { fill: none; stroke: currentColor; }
  .failure { stroke: var(--failure); }
  .pass { stroke: var(--pass); }
  .unknown { stroke: var(--unknown); }
  .evidence { stroke: var(--evidence); }
  .muted { opacity: .65; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M1 1 L9 5 L1 9" /></marker><marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="failure" d="M1 1 L9 5 L1 9" /></marker><marker id="arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="pass" d="M1 1 L9 5 L1 9" /></marker></defs>

<rect class="box" x="150" y="15" width="340" height="70" /><text x="320" y="42" text-anchor="middle" class="">Human judgment</text><text x="320" y="64" text-anchor="middle" class="small">define requirements; revise checks</text>
<path d="M 490 50 H 588 V 281 H 470" stroke-dasharray="4 5" marker-end="url(#arrow)" />
<rect class="box" x="170" y="130" width="300" height="65" /><text x="320" y="168.5" text-anchor="middle" class="">Agent revises candidate</text>
<path d="M 320 195 V 245" marker-end="url(#arrow)" />
<rect class="box" x="170" y="245" width="300" height="70" /><text x="320" y="272" text-anchor="middle" class="">Run the harness</text><text x="320" y="294" text-anchor="middle" class="small">evaluate the required behavior</text>
<path d="M 320 315 V 365" marker-end="url(#arrow)" />
<rect class="box" x="170" y="365" width="300" height="65" /><text x="320" y="403.5" text-anchor="middle" class="">Result + evidence</text>
<path class="failure" d="M 170 397 H 59 V 288" />
<path class="failure" d="M 59 250 V 163 H 170" marker-end="url(#arrow-failure)" />
<rect class="box failure" x="14" y="250" width="91" height="38" />
<text x="59" y="275" text-anchor="middle" class="small">fail</text>
<path class="pass" d="M 320 430 V 490" marker-end="url(#arrow-pass)" />
<rect class="box pass" x="330" y="444" width="54" height="31" />
<text x="357" y="465" text-anchor="middle" class="small">pass</text>
<rect class="box" x="140" y="490" width="360" height="55" /><text x="320" y="523.5" text-anchor="middle" class="">Next applicable gate</text>
</svg>
