<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Two delivery orders for the same pending request</title>
<desc id="desc">When the reply is processed first, the request completes and the timeout does nothing. When the timeout is processed first, the request returns a Send action and the reply then completes the request.</desc>
<style>
  :root { color: #1a1a1a; --secondary: #6b6b66; --accent: #42677b; }
  @media (prefers-color-scheme: dark) {
    :root { color: #f3f3ee; --secondary: #aaa89f; --accent: #9abccc; }
  }
  text { fill: currentColor; font-family: monospace; font-size: 16px; }
  .small { font-size: 14px; }
  .muted { fill: var(--secondary); }
  .action { fill: var(--accent); }
  .center { text-anchor: middle; }
  .end { text-anchor: end; }
  rect, path { fill: none; stroke: currentColor; stroke-width: 1.25; }
  .flow { stroke: var(--accent); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="flow" d="M1 1 9 5 1 9" /></marker></defs>

<text x="16" y="34">reply handled first</text>
<rect x="16" y="60" width="222" height="112" />
<text x="34" y="90">on_reply()</text>
<text class="action small" x="34" y="122">Complete</text>
<text class="muted small" x="34" y="151">done = true</text>
<path class="flow" d="M238 116H288" marker-end="url(#arrow)" />
<rect x="288" y="60" width="222" height="112" />
<text x="306" y="90">tick(10s)</text>
<text class="action small" x="306" y="122">no action</text>
<text class="muted small" x="306" y="151">done = true</text>
<path class="flow" d="M510 116H558" marker-end="url(#arrow)" />
<text x="580" y="109">no retry</text>
<text class="small muted" x="580" y="137">completed once</text>
<text x="16" y="220">timeout handled first</text>
<rect x="16" y="246" width="222" height="112" />
<text x="34" y="276">tick(10s)</text>
<text class="action small" x="34" y="308">Send</text>
<text class="muted small" x="34" y="337">retry_at = 20s</text>
<path class="flow" d="M238 302H288" marker-end="url(#arrow)" />
<rect x="288" y="246" width="222" height="112" />
<text x="306" y="276">on_reply()</text>
<text class="action small" x="306" y="308">Complete</text>
<text class="muted small" x="306" y="337">done = true</text>
<path class="flow" d="M510 302H558" marker-end="url(#arrow)" />
<text x="580" y="295">retry requested</text>
<text class="small muted" x="580" y="323">completed once</text>
</svg>
