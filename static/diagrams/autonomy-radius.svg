<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc">
<title id="title">The autonomy radius</title>
<desc id="desc">Concentric boundaries around an agent show compiler feedback, structural checks, runtime validation and production evidence. The expanding boundary is conceptual.</desc>
<style>
  :root { color: #1a1a1a; --bg: #fdfdfc; }
  @media (prefers-color-scheme: dark) { :root { color: #f3f3ee; --bg: #0d0d0b; } }
  text { fill: currentColor; font-family: monospace; font-size: 17px; }
  .small { font-size: 14px; }
  rect, circle, path, line { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .box { fill: var(--bg); }
  .dot, .arrow { fill: currentColor; stroke: none; }
  .muted { opacity: .65; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>

<circle cx="320" cy="239" r="211" />
<circle cx="320" cy="239" r="146" />
<circle cx="320" cy="239" r="78" stroke-dasharray="4 6" />
<text x="320" y="67" text-anchor="middle" class="">production evidence</text>
<text x="320" y="145" text-anchor="middle" class="">runtime validation</text>
<text x="320" y="198" text-anchor="middle" class="">compiler</text>
<circle class="dot" cx="320" cy="239" r="5" />
<text x="320" y="269" text-anchor="middle" class="">agent</text>
<text x="320" y="330" text-anchor="middle" class="">structural checks</text>
<path d="M 412 239 H 566" marker-end="url(#arrow)" />
<text x="320" y="491" text-anchor="middle" class="small">Build feedback to bring more work inside.</text>
</svg>
