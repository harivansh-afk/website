<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
<title id="title">The same request, run twice</title>
<desc id="desc">In run 1 the reply arrives before the retry deadline, so one reply comes back. In run 2 no reply has arrived by the deadline, so the request is sent again, and then two replies come back: the late one and the one for the second send. Positions show order, not measured times.</desc>
<style>
  :root { color: #1a1a1a; --evidence: #52778c; --pass: #347763; --failure: #b34d48; --unknown: #947322; }
  @media (prefers-color-scheme: dark) { :root { color: #f3f3ee; --evidence: #8daab9; --pass: #81b29b; --failure: #cf8078; --unknown: #c5ae6a; } }
  text { fill: currentColor; font-family: monospace; font-size: 17px; text-anchor: middle; }
  .small { font-size: 14px; }
  .left { text-anchor: start; }
  path, circle, rect { fill: none; stroke: currentColor; stroke-width: 1.3; }
  .axis { opacity: .45; }
  .deadline { stroke: var(--unknown); stroke-dasharray: 4 5; }
  .deadline-label { fill: var(--unknown); }
  .event { stroke: var(--evidence); fill: var(--evidence); }
  .send { fill: none; }
  .one { stroke: var(--pass); }
  .two { stroke: var(--failure); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" /></marker></defs>

<text class="small deadline-label" x="330" y="28">retry deadline</text>
<path class="deadline" d="M330 42V193" />

<text class="left" x="14" y="101">run 1</text>
<path class="axis" d="M100 95H492" marker-end="url(#arrow)" />
<circle class="event send" cx="110" cy="95" r="5" />
<text class="small" x="110" y="124">send</text>
<circle class="event" cx="215" cy="95" r="5" />
<text class="small" x="215" y="124">reply</text>
<rect class="one" x="512" y="73" width="116" height="44" />
<text x="570" y="101">1 reply</text>

<text class="left" x="14" y="191">run 2</text>
<path class="axis" d="M100 185H492" marker-end="url(#arrow)" />
<circle class="event send" cx="110" cy="185" r="5" />
<text class="small" x="110" y="214">send</text>
<circle class="event send" cx="330" cy="185" r="5" />
<text class="small" x="330" y="214">send again</text>
<circle class="event" cx="405" cy="185" r="5" />
<text class="small" x="405" y="214">reply</text>
<circle class="event" cx="465" cy="185" r="5" />
<text class="small" x="465" y="214">reply</text>
<rect class="two" x="512" y="163" width="116" height="44" />
<text x="570" y="191">2 replies</text>
</svg>
