<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc">
<title id="title">History across a crash</title>
<desc id="desc">The journal flushes through sequence 4. The writer is killed and the journal reopened. It acknowledges a new write with sequence 0. The checker remembers the durable boundary of 4 and flags sequence reuse.</desc>
<style>
  :root { color: #1a1a1a; --failure: #b34d48; --pass: #347763; --unknown: #947322; --evidence: #52778c; }
  @media (prefers-color-scheme: dark) { :root { color: #f3f3ee; --failure: #cf8078; --pass: #81b29b; --unknown: #c5ae6a; --evidence: #8daab9; } }
  text { fill: currentColor; font-family: monospace; font-size: 17px; }
  .small { font-size: 14px; }
  rect, circle, path, line { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .box { fill: none; }
  .arrow { fill: none; stroke: currentColor; }
  .failure { stroke: var(--failure); }
  .pass { stroke: var(--pass); }
  .unknown { stroke: var(--unknown); }
  .evidence { stroke: var(--evidence); }
  .muted { opacity: .65; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M1 1 L9 5 L1 9" /></marker><marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="failure" d="M1 1 L9 5 L1 9" /></marker></defs>

<rect class="box" x="30" y="20" width="345" height="65" /><text x="202.5" y="47" text-anchor="middle" class="">Append and flush</text><text x="202.5" y="69" text-anchor="middle" class="small">durable through sequence 4</text>
<path d="M 202 85 V 135" marker-end="url(#arrow)" />
<rect class="box unknown" x="30" y="135" width="345" height="65" /><text x="202.5" y="173.5" text-anchor="middle" class="">Kill writer; reopen journal</text>
<path d="M 202 200 V 250" marker-end="url(#arrow)" />
<rect class="box failure" x="30" y="250" width="345" height="65" /><text x="202.5" y="277" text-anchor="middle" class="">Append another record</text><text x="202.5" y="299" text-anchor="middle" class="small">acknowledged as sequence 0</text>
<rect class="box evidence" x="417" y="115" width="200" height="95" /><text x="517" y="142" text-anchor="middle" class="">Checker retains</text><text x="517" y="164" text-anchor="middle" class="small">durable boundary: 4</text>
<path d="M 375 52 H 516 V 115" stroke-dasharray="4 5" marker-end="url(#arrow)" />
<path class="failure" d="M 375 282 H 516 V 347" marker-end="url(#arrow-failure)" />
<path d="M 516 210 V 282" stroke-dasharray="4 5" />
<rect class="box" x="350" y="347" width="267" height="70" /><text x="483.5" y="374" text-anchor="middle" class="">Compare with history</text><text x="483.5" y="396" text-anchor="middle" class="small">sequence 0 was already used</text>
<path class="failure" d="M 484 417 V 451" marker-end="url(#arrow-failure)" />
<rect class="box failure" x="346" y="452" width="278" height="43" />
<text x="484" y="481" text-anchor="middle" class="">FAIL: sequence reused</text>
</svg>
