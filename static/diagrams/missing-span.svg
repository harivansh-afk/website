<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="title desc">
<title id="title">The missing span</title>
<desc id="desc">The first trace shows a parent operation and two child spans separated by an unexplained gap. The second trace names the gap receive_body. Both illustrate the same operation, without measured timings.</desc>
<style>
  :root { color: #1a1a1a; --failure: #b34d48; --pass: #347763; --unknown: #947322; --evidence: #52778c; }
  @media (prefers-color-scheme: dark) { :root { color: #f3f3ee; --failure: #cf8078; --pass: #81b29b; --unknown: #c5ae6a; --evidence: #8daab9; } }
  text { fill: currentColor; font-family: monospace; font-size: 17px; }
  .small { font-size: 14px; }
  rect, circle, path, line { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .box { fill: none; }
  .arrow { fill: none; stroke: currentColor; }
  .failure { stroke: var(--failure); }
  .pass { stroke: var(--pass); }
  .unknown { stroke: var(--unknown); }
  .evidence { stroke: var(--evidence); }
  .muted { opacity: .65; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M1 1 L9 5 L1 9" /></marker></defs>

<text x="320" y="26" text-anchor="middle" class="">partial instrumentation</text>
<rect class="box" x="30" y="43" width="580" height="36" /><text x="320" y="67" text-anchor="middle" class="">VM operation</text>
<rect class="box" x="30" y="99" width="110" height="42" /><text x="85" y="126" text-anchor="middle" class="">prepare</text>
<rect class="unknown" x="151" y="99" width="315" height="42" stroke-dasharray="4 5" />
<text x="309" y="125" text-anchor="middle" class="muted">unexplained wait</text>
<rect class="box" x="477" y="99" width="133" height="42" /><text x="543.5" y="126" text-anchor="middle" class="">complete</text>
<text x="320" y="203" text-anchor="middle" class="">wait instrumented</text>
<rect class="box" x="30" y="220" width="580" height="36" /><text x="320" y="244" text-anchor="middle" class="">VM operation</text>
<rect class="box" x="30" y="276" width="110" height="42" /><text x="85" y="303" text-anchor="middle" class="">prepare</text>
<rect class="box evidence" x="151" y="276" width="315" height="42" /><text x="308.5" y="303" text-anchor="middle" class="">receive_body</text>
<rect class="box" x="477" y="276" width="133" height="42" /><text x="543.5" y="303" text-anchor="middle" class="">complete</text>
<path d="M 30 351 H 608" marker-end="url(#arrow)" />
<text x="320" y="345" text-anchor="middle" class="small">execution order</text>
</svg>
