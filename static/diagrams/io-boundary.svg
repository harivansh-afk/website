<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">The boundary around the decision code</title>
<desc id="desc">The network, the clock and the model sit outside the decision code. What they produce crosses into it as recorded events, and the decision code returns actions. In the animation, events first arrive at uneven times from the live sources. Then the sources are replaced by a replay of the recording, the same events arrive in the same order without waiting, and the same actions come out.</desc>
<style>
  :root { color: #1a1a1a; --evidence: #52778c; }
  @media (prefers-color-scheme: dark) { :root { color: #f3f3ee; --evidence: #8daab9; } }
  text { fill: currentColor; font-family: monospace; font-size: 17px; text-anchor: middle; }
  .small { font-size: 14px; }
  .chip-text { font-size: 12px; }
  .left { text-anchor: start; }
  .muted { fill-opacity: .6; }
  rect, path { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .input { stroke: var(--evidence); }
  .lane { opacity: .45; stroke-dasharray: 4 5; }
  .replay-box { stroke: var(--evidence); stroke-dasharray: 4 5; }
  .replay, .caption-replay { opacity: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .anim { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .c1m { animation-name: c1m; } .c1f { animation-name: c1f; }
    .c2m { animation-name: c2m; } .c2f { animation-name: c2f; }
    .c3m { animation-name: c3m; } .c3f { animation-name: c3f; }
    .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; }
    .sources, .caption-live { animation-name: live; }
    .replay, .caption-replay { animation-name: replay; }
  }

  /* live: t=10s at 0.6s, reply 7 at 1.5s, model at 2.6s; replay: 6.4s, 6.8s, 7.2s, twice as fast */
  @keyframes c1m { 0%, 5% { transform: translateX(0) } 16.67% { transform: translateX(160px) } 53.2% { transform: translateX(160px) } 53.33% { transform: translateX(0) } 60%, 100% { transform: translateX(160px) } }
  @keyframes c1f { 0%, 5% { opacity: 0 } 6%, 16.67% { opacity: 1 } 18.3%, 53.33% { opacity: 0 } 54%, 60% { opacity: 1 } 61.25%, 100% { opacity: 0 } }
  @keyframes c2m { 0%, 12.5% { transform: translateX(0) } 24.17% { transform: translateX(160px) } 56.5% { transform: translateX(160px) } 56.67% { transform: translateX(0) } 63.33%, 100% { transform: translateX(160px) } }
  @keyframes c2f { 0%, 12.5% { opacity: 0 } 13.5%, 24.17% { opacity: 1 } 25.8%, 56.67% { opacity: 0 } 57.3%, 63.33% { opacity: 1 } 64.6%, 100% { opacity: 0 } }
  @keyframes c3m { 0%, 21.67% { transform: translateX(0) } 33.33% { transform: translateX(160px) } 59.8% { transform: translateX(160px) } 60% { transform: translateX(0) } 66.67%, 100% { transform: translateX(160px) } }
  @keyframes c3f { 0%, 21.67% { opacity: 0 } 22.7%, 33.33% { opacity: 1 } 35%, 60% { opacity: 0 } 60.7%, 66.67% { opacity: 1 } 67.9%, 100% { opacity: 0 } }
  @keyframes a1 { 0%, 16.6% { opacity: 0 } 17.5%, 44% { opacity: 1 } 46%, 59.9% { opacity: 0 } 60.8%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
  @keyframes a2 { 0%, 24.1% { opacity: 0 } 25%, 44% { opacity: 1 } 46%, 63.2% { opacity: 0 } 64.1%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
  @keyframes a3 { 0%, 33.3% { opacity: 0 } 34.2%, 44% { opacity: 1 } 46%, 66.6% { opacity: 0 } 67.5%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
  @keyframes live { 0%, 44% { opacity: 1 } 48%, 95% { opacity: 0 } 100% { opacity: 1 } }
  @keyframes replay { 0%, 46% { opacity: 0 } 50%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="input" d="M1 1 9 5 1 9" /></marker></defs>

<g class="sources anim">
  <rect class="input" x="14" y="50" width="90" height="44" />
  <text class="small" x="59" y="77">network</text>
  <rect class="input" x="14" y="128" width="90" height="44" />
  <text class="small" x="59" y="155">clock</text>
  <rect class="input" x="14" y="206" width="90" height="44" />
  <text class="small" x="59" y="233">model</text>
  <path class="input" d="M104 72H111V150M104 228H111V150M104 150H118" />
</g>
<g class="replay anim">
  <rect class="replay-box" x="14" y="50" width="90" height="200" />
  <text class="small" x="59" y="155">replay</text>
  <path class="input" d="M104 150H118" />
</g>

<text class="small muted" x="235" y="118">recorded events</text>
<rect class="lane" x="118" y="128" width="234" height="44" />

<g class="c1m anim"><g class="c1f anim">
  <rect class="input" x="124" y="136" width="72" height="28" /><text class="chip-text" x="160" y="154">t = 10s</text>
</g></g>
<g class="c2m anim" style="transform: translateX(76px)"><g class="c2f anim">
  <rect class="input" x="124" y="136" width="72" height="28" /><text class="chip-text" x="160" y="154">reply 7</text>
</g></g>
<g class="c3m anim" style="transform: translateX(152px)"><g class="c3f anim">
  <rect class="input" x="124" y="136" width="72" height="28" /><text class="chip-text" x="160" y="154">model: ls</text>
</g></g>

<path class="input" d="M352 150H360" />
<rect x="360" y="110" width="112" height="80" />
<text x="416" y="146">decision</text>
<text x="416" y="168">code</text>
<text class="small muted" x="416" y="214">no I/O</text>

<path class="input" d="M472 150H494" marker-end="url(#arrow)" />
<text class="small muted left" x="502" y="108">actions</text>
<text class="small left a1 anim" x="502" y="132">send 7</text>
<text class="small left a2 anim" x="502" y="156">complete 7</text>
<text class="small left a3 anim" x="502" y="180">run ls</text>

<text class="small muted caption-live anim" x="320" y="286">live: events arrive whenever the world sends them</text>
<text class="small muted caption-replay anim" x="320" y="286">replay: same events, same order, no waiting</text>
</svg>
