<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">Two queues between the request logic and the network</title>
<desc id="desc">The request logic owns the state of every request. It puts messages like send 7 on an outgoing queue, which the network worker takes and sends. The worker puts messages like reply 7 on an incoming queue, which the logic reads one at a time. The worker never changes the logic's state directly.</desc>
<style>
  :root { color: #1a1a1a; --evidence: #52778c; }
  @media (prefers-color-scheme: dark) { :root { color: #f3f3ee; --evidence: #8daab9; } }
  text { fill: currentColor; font-family: monospace; font-size: 17px; text-anchor: middle; }
  .small { font-size: 14px; }
  rect, path, line { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .memory { opacity: .4; stroke-dasharray: 4 5; }
  .message { stroke: var(--evidence); }
  .slot { opacity: .4; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="message" d="M1 1 9 5 1 9" /></marker></defs>

<text class="small" x="317" y="28">queues in memory</text>
<rect class="memory" x="203" y="43" width="228" height="235" />

<rect x="14" y="110" width="167" height="100" />
<text x="97.5" y="149">Request logic</text>
<text class="small" x="97.5" y="175">owns the state</text>

<rect x="459" y="110" width="167" height="100" />
<text x="542.5" y="149">Network worker</text>
<text class="small" x="542.5" y="175">async I/O</text>

<text class="small" x="317" y="72">outgoing queue</text>
<rect class="message" x="218" y="86" width="198" height="44" />
<path class="slot" d="M284 86V130M350 86V130" />
<text class="small" x="251" y="113">send 7</text>
<path class="message" d="M181 137H192V108H218" marker-end="url(#arrow)" />
<path class="message" d="M416 108H440V137H459" marker-end="url(#arrow)" />

<text class="small" x="317" y="207">incoming queue</text>
<rect class="message" x="218" y="221" width="198" height="44" />
<path class="slot" d="M284 221V265M350 221V265" />
<text class="small" x="251" y="248">reply 7</text>
<path class="message" d="M459 184H440V243H416" marker-end="url(#arrow)" />
<path class="message" d="M218 243H192V184H181" marker-end="url(#arrow)" />
</svg>
