<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">A queue between the logic and the outside world</title>
<desc id="desc">The program logic owns its state. Requests pass right through an outgoing queue in memory to an I/O worker. Replies and errors pass left through an incoming queue to the logic. The worker handles the network or disk and never changes the logic's state directly.</desc>
<style>
  :root { color: #1a1a1a; --evidence: #52778c; }
  @media (prefers-color-scheme: dark) { :root { color: #f3f3ee; --evidence: #8daab9; } }
  text { fill: currentColor; font-family: monospace; font-size: 17px; text-anchor: middle; }
  .small { font-size: 14px; }
  rect, path, line { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .memory { opacity: .4; stroke-dasharray: 4 5; }
  .message { stroke: var(--evidence); }
  .slot { opacity: .4; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="message" d="M1 1 9 5 1 9" /></marker></defs>

<text class="small" x="317" y="28">queues in memory</text>
<rect class="memory" x="203" y="43" width="228" height="235" />

<rect x="14" y="110" width="153" height="100" />
<text x="90.5" y="149">Program logic</text>
<text class="small" x="90.5" y="175">owns the state</text>

<rect x="473" y="110" width="153" height="100" />
<text x="549.5" y="149">I/O worker</text>
<text class="small" x="549.5" y="175">network / disk</text>

<text class="small" x="317" y="72">outgoing requests</text>
<rect class="message" x="218" y="86" width="198" height="44" />
<path class="slot" d="M284 86V130M350 86V130" />
<text x="251" y="114">send</text>
<path class="message" d="M167 137H188V108H218" marker-end="url(#arrow)" />
<path class="message" d="M416 108H451V137H473" marker-end="url(#arrow)" />

<text class="small" x="317" y="207">incoming results</text>
<rect class="message" x="218" y="221" width="198" height="44" />
<path class="slot" d="M284 221V265M350 221V265" />
<text x="251" y="249">reply</text>
<path class="message" d="M473 184H451V243H416" marker-end="url(#arrow)" />
<path class="message" d="M218 243H188V184H167" marker-end="url(#arrow)" />
</svg>
